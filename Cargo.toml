[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
default-members = ["crates/cmx"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Zero external dependencies: see claude/CORE-DESIGN.md §3. Only path dependencies are allowed.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
